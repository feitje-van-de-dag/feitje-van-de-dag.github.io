// Het raam laat de echte tijd en het seizoen zien (Amsterdam): zon en maan op hun baan, sterren, schemering, en lente, zomer, herfst of winter buiten.
// Test: voeg ?uur=22 en/of ?maand=0 (januari = 0) aan de link toe om een ander moment te zien.

  Ritchie: { muur: "#d9e4ff", streep: "#e7eeff", plint: "#bccbf2" },

function hemelNu() {

  const q = new URLSearchParams(location.search);
  let uur = d.getHours() + d.getMinutes() / 60, maand = d.getMonth();

function tekenGroepen() {

function plekkenZichtbaar() {
  const lijst = winkelItems();

}
function normaliseerPlek() {
  if (huidigeGroep === "Alles" || huidigeGroep === "Kostuum") return;
  const z = plekkenZichtbaar();

  el.hidden = zichtbaar_.length === 0;

function tekenGrid() {
  const el = document.getElementById("grid");
  const wie = wieNu();
  el.innerHTML = "";
  const leeg = document.getElementById("leeg");
  if (!huidigeGroep) { el.hidden = true; leeg.hidden = true; return; }
  el.hidden = false;
  normaliseerPlek();
  const plek = (plekkenNu().find(function (p) { return p[0] === huidigePlek; }) || [])[1];
  const lijst = huidigeGroep === "Alles" || huidigeGroep === "Kostuum" ? winkelItems() : winkelItems().filter(function (i) { return !plek || i.plek === plek; });

  leeg.textContent = items.length ? "Hier is niets te koop." : "De catalogus is nog niet geladen.";

    const eigen = magKopen(i, wie);

    const past = eigen && proef.indexOf(i.id) >= 0;
    b.type = "button";
    b.className = "item" + (eigen && bezit[i.id] ? " is-van-jou" : "") + (past ? " past" : "");
    b.innerHTML = '<span class="plaatje"></span><span class="naam"></span><span class="prijs"></span><span class="bezit"></span>';

    b.querySelector(".plaatje").innerHTML = KamerStijlen.isKamer(i) ? kamerMini(i) : figuurHTML(kaartVoor, Skins.isSkin(i) ? [i.id] : [i.id].concat(gedragenKleuren(kaartVoor)));

  const pasKnop = document.getElementById("detail-pas");

  const draagKnop = document.getElementById("detail-draag");
  const verkoopKnop = document.getElementById("detail-verkoop");
  pasKnop.hidden = koopKnop.hidden = draagKnop.hidden = verkoopKnop.hidden = true;
  koopKnop.disabled = false;
  const tekst = document.getElementById("detail-tekst");
  if (!eigen) {
    tekst.innerHTML = '<span class="chip-prijs">' + (wie ? "Voor " + voorWie + " " : "") + prijsHTML(i.prijs) + '</span>';
  } else if (bezit[i.id]) {
    const aan = (draagt[wie] || []).indexOf(i.id) >= 0;
    tekst.innerHTML = '<span class="chip-prijs">Van jou</span>';
    draagKnop.hidden = false;
    draagKnop.textContent = aan ? "Trek uit" : "Draag";
    verkoopKnop.hidden = false;
    verkoopKnop.innerHTML = "Verkoop " + prijsHTML(Math.floor(i.prijs / 2));
  } else {
    const past = proef.indexOf(i.id) >= 0;
    tekst.innerHTML = '<span class="chip-prijs">' + prijsHTML(i.prijs) + '</span>';
    pasKnop.hidden = false;
    pasKnop.textContent = isKledingItem(i) ? (past ? "Niet meer passen" : "Pas dit") : (past ? "Stop met proberen" : "Probeer dit");
    koopKnop.hidden = false;
    koopKnop.innerHTML = "Koop " + prijsHTML(i.prijs);
    koopKnop.disabled = saldo < i.prijs;
  }
  document.getElementById("detail").hidden = false;
}
function sluitDetail() { document.getElementById("detail").hidden = true; }

function alles() { tekenSaldo(); tekenPoppen(); tekenWieChips(); tekenChips(); tekenGrid(); }

// Passen: alleen zichtbaar op jouw poppetje, nergens opgeslagen. Eén item per plek.
function pas() {
  if (!gekozen) return;
  const plek = gekozen.plek;
  const al = proef.indexOf(gekozen.id) >= 0;
  proef = proef.filter(function (id) { return id !== gekozen.id && (itemMet(id) || {}).plek !== plek; });
  if (!al) proef.push(gekozen.id);
  sluitDetail();
  meld("");
  alles();
  window.scrollTo({ top: 0, behavior: "smooth" });
}

async function actie(naam, args) {
  const wie = wieNu();
  if (!wie) return null;
  const knoppen = Array.prototype.slice.call(document.querySelectorAll("#detail button, #poppen button.tq-knop"));
  knoppen.forEach(function (k) { k.disabled = true; });
  try { return await window.dbRpc(naam, Object.assign({ p_wie: wie }, args)); }
  catch (e) { return { ok: false, reden: "geen verbinding" }; }
  finally { knoppen.forEach(function (k) { k.disabled = false; }); }
}

async function koop() {
  if (!gekozen) return;
  const i = gekozen;
  const melding = document.getElementById("detail-melding");
  const r = await actie("koop_item", { p_item: i.id });
  if (r && r.ok) {
    await actie("draag_item", { p_item: i.id, p_aan: true });
    proef = proef.filter(function (id) { return id !== i.id; });
    await laadAlles();
    sluitDetail();
    meld("Gekocht en aan: " + i.naam + ".");
    alles();
  } else {
    melding.textContent = "Niet gelukt: " + (r && r.reden ? r.reden : "probeer het nog eens") + ".";
  }
}

// Alles kopen wat je nu past, in één keer. Stopt bij de eerste die niet lukt.
async function koopProef() {
  const wie = wieNu();
  if (!wie) return;
  const lijst = proef.map(itemMet).filter(function (i) { return i && !bezit[i.id]; });
  let gelukt = 0, fout = "";
  for (const i of lijst) {
    const r = await actie("koop_item", { p_item: i.id });
    if (r && r.ok) { gelukt++; await actie("draag_item", { p_item: i.id, p_aan: true }); proef = proef.filter(function (id) { return id !== i.id; }); }
    else { fout = (r && r.reden) ? r.reden : "probeer het nog eens"; break; }
  }
  await laadAlles();
  meld(fout ? "Gekocht: " + gelukt + ". Daarna niet gelukt: " + fout + "." : "Gekocht en aan: " + gelukt + " item" + (gelukt === 1 ? "" : "s") + ".");
  alles();
}

async function draagOfUit() {
  if (!gekozen) return;
  const wie = wieNu();
  const aan = (draagt[wie] || []).indexOf(gekozen.id) < 0;
  const r = await actie("draag_item", { p_item: gekozen.id, p_aan: aan });
  if (r && r.ok) {
    if (aan) proef = proef.filter(function (id) { return (itemMet(id) || {}).plek !== gekozen.plek; });
    await laadAlles();
    sluitDetail();
    meld(aan ? gekozen.naam + " staat aan." : gekozen.naam + " is uit.");
    alles();
  } else {
    document.getElementById("detail-melding").textContent = "Niet gelukt: " + (r && r.reden ? r.reden : "probeer het nog eens") + ".";
  }
}

async function verkoop() {
  if (!gekozen) return;
  const i = gekozen;
  const r = await actie("verkoop_item", { p_item: i.id });
  if (r && r.ok) {
    await laadAlles();
    sluitDetail();
    meld("Verkocht: " + i.naam + " voor " + r.bedrag + ".");
    alles();
  } else {
    document.getElementById("detail-melding").textContent = "Niet gelukt: " + (r && r.reden ? r.reden : "probeer het nog eens") + ".";
  }
}

// Alles in een paar verzoeken in plaats van één per item (voorheen ruim 100): bezit uit de aankopen en verkopen van de speler, saldo en uitrusting.
async function laadAlles() {
  const wie = wieNu();
  bezit = {};
  if (wie) {
    try {
      const db = await window.claude.use("db");
      const delen = await Promise.all([
        window.dbRpc("munten_saldo", { p_wie: wie }).catch(function () { return saldo; }),
        db.collection("aankopen").where("wie", "==", wie).get(),
        db.collection("verkopen").where("wie", "==", wie).get()
      ]);
      saldo = delen[0];
      const tel = {};
      delen[1].docs.filter(function (d) { return d.exists; }).forEach(function (d) { const it = d.data().item; if (it) tel[it] = (tel[it] || 0) + 1; });
      delen[2].docs.filter(function (d) { return d.exists; }).forEach(function (d) { const it = d.data().item; if (it) tel[it] = (tel[it] || 0) - 1; });
      Object.keys(tel).forEach(function (k) { if (tel[k] > 0) bezit[k] = tel[k]; });
    } catch (e) {
      // Terugval: de oude manier, per item.
      const delen = await Promise.all([
        window.dbRpc("munten_saldo", { p_wie: wie }).catch(function () { return saldo; }),
        Promise.all(items.map(function (i) { return window.dbRpc("bezit_aantal", { p_wie: wie, p_item: i.id }).then(function (n) { return [i.id, n]; }).catch(function () { return [i.id, 0]; }); }))
      ]);
      saldo = delen[0];
      delen[1].forEach(function (p) { if (p[1] > 0) bezit[p[0]] = p[1]; });
    }
  }
  await Promise.all(NAMEN.map(function (n) {
    return window.dbRpc("uitrusting_van", { p_wie: n }).then(function (l) { draagt[n] = l || []; }).catch(function () { /* oude stand blijft */ });
  }));
}
// De winkel staat meteen op het scherm met wat de vorige keer bekend was (cache in localStorage) en wordt daarna stil bijgewerkt: alleen als er iets veranderd is, tekent hij opnieuw. Zo verspringt er niets.
function winkelSleutel() { return "winkelcache-v1-" + (wieNu() || "gast"); }
function winkelHandtekening() { return JSON.stringify([items.map(function (i) { return i.id + ":" + i.prijs; }), bezit, draagt, saldo]); }
function bewaarWinkelCache() { try { localStorage.setItem(winkelSleutel(), JSON.stringify({ items: items, bezit: bezit, draagt: draagt, saldo: saldo })); } catch (e) { /* te groot of geen opslag: dan geen cache */ } }
function leesWinkelCache() { try { const c = JSON.parse(localStorage.getItem(winkelSleutel()) || "null"); return c && c.items && c.items.length ? c : null; } catch (e) { return null; } }
let laatsteWinkel = "";
function verversAlsNodig() { const nu = winkelHandtekening(); if (nu !== laatsteWinkel) { laatsteWinkel = nu; alles(); bewaarWinkelCache(); } }
async function werkMuntenBij() {
  try {
    const db = await window.claude.use("db");
    const stand = await berekenStand(db);
    for (const n of NAMEN) {
      const aantal = (stand.gewonnen[n] || 0) * MUNTEN_PER_QUIZ + (stand.wekenGewonnen[n] || 0) * MUNTEN_PER_WEEK;
      await window.dbRpc("zet_verdiend", { p_wie: n, p_aantal: aantal });
    }
    await laadAlles();
    verversAlsNodig();
  } catch (e) { /* het saldo blijft zoals het was */ }
}

async function start() {
  toonVoor = wieNu() || "Ritchie";
  const cache = leesWinkelCache();
  if (cache) { // meteen een volledige winkel, zonder te wachten op het netwerk
    items = cache.items; bezit = cache.bezit || {}; draagt = cache.draagt || draagt; saldo = cache.saldo || 0;
    tekenGroepen(); tekenChips(); tekenPoppen(); alles();
    laatsteWinkel = winkelHandtekening();
  }
  try {
    // Lijst en eigen spullen tegelijk ophalen (de terugval per item gebruikt de lijst, dus die staat bij een koude start al in `items` als er een cache was).
    const resultaat = await Promise.all([window.dbRpc("shop_lijst", {}), laadAlles()]);
    items = resultaat[0].filter(function (i) { return i.plek; });
  } catch (e) {
    document.getElementById("leeg").hidden = false;
    document.getElementById("leeg").textContent = "De catalogus is nog niet geladen.";
  }
  if (!cache) { tekenGroepen(); tekenChips(); tekenPoppen(); alles(); laatsteWinkel = winkelHandtekening(); bewaarWinkelCache(); } // niets eerder getekend: nu in één keer
  else verversAlsNodig();
  document.getElementById("hoe-rij").innerHTML = '<span class="chip-prijs">Quiz gewonnen ' + prijsHTML(MUNTEN_PER_QUIZ) + '</span><span class="chip-prijs">Week gewonnen ' + prijsHTML(MUNTEN_PER_WEEK) + '</span>';
  werkMuntenBij();
}

document.getElementById("detail-pas").addEventListener("click", pas);
document.getElementById("detail-koop").addEventListener("click", koop);
document.getElementById("detail-draag").addEventListener("click", draagOfUit);
document.getElementById("detail-verkoop").addEventListener("click", verkoop);
document.getElementById("detail-sluit").addEventListener("click", sluitDetail);
document.getElementById("detail").addEventListener("click", function (e) { if (e.target.id === "detail") sluitDetail(); });
start();
</script>
