<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<title>Random quiz</title>
<style>
.kaart + .kaart { margin-top: 14px; }

:root {
  color-scheme: light;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  --card: var(--vlak);
  --ink: var(--inkt);
  --muted: var(--zacht);
  --line: var(--beige-lijn);
  --a: var(--geel);
  --b: var(--roze-licht);
  --c: var(--goed-licht);
  --d: var(--paars);
  --ok: var(--goed);
  --bad: var(--fout);
  --display: var(--body);
  --body: "Instrument Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--body);
  font-size: 16px;
  line-height: 1.5;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 24px 40px;
}
main { max-width: 560px; margin: 0 auto; display: flex; flex-direction: column; gap: 24px; min-width: 0; }
.top { display: flex; flex-direction: column; gap: 8px; }
.terug { color: var(--ink); font-weight: 600; text-decoration: none; justify-self: start; }
.terug:hover { text-decoration: underline; }
.datum { margin: 0; color: var(--muted); }
.wie { margin: 0; font-weight: 700; }
.melding { margin: 0; padding: 12px 14px; border-radius: 12px; background: var(--vlak); border: 2px solid var(--bad); color: var(--bad); font-weight: 600; }
.quiz { display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.quizkop { display: flex; flex-direction: column; gap: 4px; }
.quizkop h2 { margin: 0; font-family: var(--display); font-size: 26px; font-weight: 600; }
.score { margin: 0; color: var(--muted); font-weight: 600; }
.kaart { background: var(--card); border-radius: 18px; padding: 18px; display: flex; flex-direction: column; gap: 12px; min-width: 0; box-shadow: 0 2px 0 var(--line); }
.chip { margin: 0; justify-self: start; font-size: 13px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; color: var(--muted); }
.kaart h3 { margin: 0; font-size: 19px; font-weight: 700; line-height: 1.3; text-wrap: balance; }
.opties { display: grid; grid-template-columns: 1fr; gap: 10px; }
@media (min-width: 420px) { .opties { grid-template-columns: 1fr 1fr; } }
.opt {
  min-height: 56px;
  border: 0;
  border-radius: 16px;
  padding: 10px 14px;
  font: inherit;
  font-size: 16px;
  font-weight: 600;
  text-align: left;
  color: var(--ink);
  cursor: pointer;
  min-width: 0;
  overflow-wrap: anywhere;
}
.opt b { margin-right: 4px; }
.opt.a { background: var(--a); }
.opt.b { background: var(--b); }
.opt.c { background: var(--c); }
.opt.d { background: var(--d); }
.opt:disabled { cursor: default; opacity: 0.55; }
.opt.gekozen { opacity: 1; outline: 3px solid var(--ink); outline-offset: 2px; }
.opt:focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; }
.feedback { margin: 0; padding: 12px 14px; border-radius: 12px; background: var(--paars-zacht); font-size: 15px; }
.feedback.ok { border-left: 6px solid var(--ok); }
.feedback.nee { border-left: 6px solid var(--bad); }
.extra, .opnieuw, .plusknop, .verwijder {
  min-height: 52px;
  border-radius: 16px;
  border: 2px solid var(--ink);
  background: transparent;
  color: var(--ink);
  font: inherit;
  font-weight: 700;
  padding: 10px 16px;
  cursor: pointer;
}
.plusknop { background: var(--ink); color: var(--vlak); font-size: 18px; }
.plusknop:disabled { opacity: 0.5; cursor: default; }
.verwijder { border-color: var(--bad); color: var(--bad); }
.verwijder.ja { background: var(--bad); color: var(--vlak); }
.extra:focus-visible, .opnieuw:focus-visible, .plusknop:focus-visible, .verwijder:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }
.plus, .bronnen { display: flex; flex-direction: column; gap: 12px; min-width: 0; background: var(--card); border-radius: 18px; box-shadow: 0 6px 0 var(--lijn); padding: 18px; }
.plus h2, .bronnen h2 { margin: 0; font-size: 13px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--roze-diep); }
.uitleg { margin: 0; color: var(--muted); font-size: 15px; }
.wachtrij { margin: 0; padding-left: 0; list-style: none; color: var(--ink); display: flex; flex-direction: column; gap: 10px; }
.laad { display: flex; flex-direction: column; gap: 6px; margin: 0; }
.laad-kop { display: flex; justify-content: space-between; gap: 12px; font-weight: 700; }
.laad-pct { font-variant-numeric: tabular-nums; }
.laad-balk { height: 14px; border-radius: 999px; background: var(--roze-zacht); overflow: hidden; }
.laad-balk > i { display: block; height: 100%; width: 0%; border-radius: 999px; background: var(--roze); transition: width 0.4s ease; }
.laad.klaar .laad-balk > i { background: var(--mint); }

.bronnen ul { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 8px; overflow-wrap: anywhere; }
.bronnen li { background: var(--bg); border-radius: 12px; padding: 8px 12px; font-size: 15px; }
.bronnen a { color: var(--ink); font-weight: 700; }
.bronnen .bronwacht { background: none; padding: 0; color: var(--muted); font-size: 14px; }
.leeg { margin: 0; color: var(--muted); }
.voet { margin: 0; text-align: center; }
.voet a { color: var(--ink); font-weight: 700; }

.voortgang { display: flex; flex-direction: column; gap: 6px; margin: 0; }
.voortgang p { margin: 0; font-weight: 700; display: flex; justify-content: space-between; gap: 12px; }
.balkje { height: 12px; border-radius: 999px; background: var(--paars-lijn); overflow: hidden; }
.balkje > i { display: block; height: 100%; width: 0%; border-radius: 999px; background: var(--paars-diep); transition: width 0.3s ease; }
.uitslag { background: var(--vlak); border-radius: 18px; padding: 18px; display: flex; flex-direction: column; gap: 10px; box-shadow: 0 2px 0 var(--line); }
.uitslag h2 { margin: 0; font-family: var(--display); font-size: 26px; font-weight: 600; }
.uitslag p { margin: 0; font-weight: 600; }
.paars { background: var(--paars); color: var(--ink); border: 0; min-height: 56px; font-size: 18px; border-radius: 16px; font: inherit; font-weight: 800; cursor: pointer; padding: 10px 16px; }
.paars:disabled { opacity: 0.5; cursor: default; }
.stop { border-color: var(--bad); color: var(--bad); }
.stop.ja { background: var(--bad); color: var(--vlak); }
.acties { display: flex; flex-direction: column; gap: 10px; }
/* Beweging: kort en zacht. Wie verminderde beweging aanzet, ziet niets bewegen (zie onderaan). */
button, a { transition: transform 0.15s ease, box-shadow 0.2s ease, background-color 0.2s ease, opacity 0.2s ease; }
button:active:not(:disabled) { transform: scale(0.97); }
.kaart { animation: omhoog 0.35s ease both; }
/* Na het eerste laden geen instapanimatie meer: anders springen de kaarten elke keer dat de quiz opnieuw wordt getekend. */
html[data-geladen] .kaart { animation: none; }
.opt:not(:disabled):hover { transform: translateY(-2px); box-shadow: 0 4px 0 rgba(42, 31, 74, 0.12); }
.opt.gekozen { animation: puls 0.4s ease; }
.feedback { animation: vervaag 0.4s ease both; }
.balkje > i { transition: width 0.6s ease; }
@keyframes omhoog { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
@keyframes vervaag { from { opacity: 0; } to { opacity: 1; } }
@keyframes puls { 0% { transform: scale(1); } 50% { transform: scale(1.03); } 100% { transform: scale(1); } }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
/* Koppen: terugknop en naam als nette chips */
.top { gap: 12px; }
.terug { align-self: flex-start; display: inline-flex; align-items: center; min-height: 36px; padding: 6px 14px; border-radius: 999px; background: var(--card); box-shadow: 0 2px 0 var(--line); font-size: 14px; }
.wie { align-self: flex-start; display: inline-flex; align-items: center; min-height: 36px; padding: 6px 14px; border-radius: 999px; background: var(--card); box-shadow: 0 2px 0 var(--line); font-size: 15px; }
.datum { font-size: 15px; color: var(--muted); }
</style>

<body>
<main>
  <header class="top">
    <a class="terug" href="index.html">&larr; Overzicht</a>
    <p class="eyebrow">Oefenen</p>
    <h1 id="quiznaam">Random quiz</h1>
    <div class="naam-rij"><button type="button" class="naam-knop" id="naam-knop">Naam wijzigen</button><button type="button" class="verwijder" id="verwijder-knop">Verwijderen</button></div>
    <div class="naam-bewerk" id="naam-bewerk" hidden>
      <input id="naam-veld" type="text" maxlength="40" aria-label="Naam van de quiz">
      <button type="button" class="naam-opslaan" id="naam-opslaan">Opslaan</button>
    </div>
    <p class="datum" id="modus"></p>
    <p class="wie" id="wie">Laden</p>
  </header>

  <p id="melding" class="melding" hidden></p>
  <div id="voortgang" class="voortgang" hidden></div>
  <div id="uitslag" hidden></div>
  <div id="quiz"></div>
  <div id="acties" class="acties" hidden></div>
  <details class="bronnen tap">
    <summary><h2 id="bron-kop">Bronnen</h2></summary>
    <ul id="bronnen"></ul>
  </details>
  <a class="tq-knop terug-knop" href="index.html">Terug naar het overzicht</a>
</main>
<script src="supabase-shim.js"></script>
<script src="kleuren.js"></script>
<script src="naam.js"></script>
<script>
const LETTERS = ["a", "b", "c", "d"];
const el = (id) => document.getElementById(id);
function maak(tag, cls, tekst) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (tekst !== undefined) e.textContent = tekst;
  return e;
}

// Uitslag per vraag: een badge (Goed/Fout) en een knop. Het antwoord staat verborgen tot je op de knop tikt.
const uitgeklapt = new Set();
function uitslagBlok(kaart, id, goed, tekst, bronnen) {
  const rij = maak("div", "uitslag-rij");
  rij.appendChild(maak("span", "badge " + (goed ? "goed" : "fout"), goed ? "Goed" : "Fout"));
  const open = uitgeklapt.has(String(id));
  const knop = maak("button", "toon", open ? "Verberg" : "Bekijk antwoord");
  knop.type = "button";
  knop.dataset.toon = id;
  knop.setAttribute("aria-expanded", String(open));
  rij.appendChild(knop);
  kaart.appendChild(rij);
  if (open) {
    kaart.appendChild(maak("p", "antwoord-tekst", tekst));
    const links = (bronnen || []).filter(function (b) { return b.url; });
    if (links.length) {
      const regel = maak("p", "bron-regel");
      links.forEach(function (br, k) {
        if (k) regel.appendChild(document.createTextNode(" · "));
        const a = maak("a", "", br.titel);
        a.href = br.url; a.target = "_blank"; a.rel = "noopener";
        regel.appendChild(a);
      });
      kaart.appendChild(regel);
    }
  }
}
function wisselUitslag(id) { id = String(id); if (uitgeklapt.has(id)) uitgeklapt.delete(id); else uitgeklapt.add(id); }

function toonFout(t) { const m = el("melding"); m.textContent = t; m.hidden = false; }
function wisFout() { el("melding").hidden = true; }

let wie = null;
try { const w = localStorage.getItem("wie"); if (w === "Ritchie" || w === "Rachel") wie = w; } catch (e) { /* geen opslag */ }
if (!wie) location.replace("index.html");
const andere = wie === "Ritchie" ? "Rachel" : "Ritchie";
const ID = (new URLSearchParams(location.search).get("id") || "").replace(/[^A-Za-z0-9]/g, "");
if (!ID) location.replace("index.html");

let db = null;
let meta = null;
let vragen = [];
let antw = { Ritchie: {}, Rachel: {} };   // wie -> vraag-id -> {gekozen, goed}
let gestopt = { Ritchie: false, Rachel: false };
let poll = null;
let stopBevestig = false;

async function laad() {
  const m = await db.doc("oefquizzen/" + ID).get();
  meta = m.exists ? m.data() : null;
  if (!meta) return;
  const qs = await db.collection("questions").where("oefquiz", "==", ID).get();
  vragen = qs.docs.filter((s) => s.exists).map((s) => Object.assign({ id: s.id }, s.data())).sort((a, b) => a.i - b.i);
  if (!meta.naam && vragen.length) {
    meta.naam = await kiesNaamVoor(vragen, "oefquizzen");
    try { await db.doc("oefquizzen/" + ID).set(meta); } catch (e) { /* later opnieuw */ }
  }
  document.getElementById("quiznaam").textContent = meta.naam || "Random quiz";
  document.title = meta.naam || "Random quiz";
  // Alleen de maker van de quiz ziet de verwijderknop.
  document.getElementById("verwijder-knop").hidden = !(meta && meta.door === wie);
  const ks = await db.collection("keuzes").where("oefquiz", "==", ID).get();
  antw = { Ritchie: {}, Rachel: {} };
  gestopt = { Ritchie: false, Rachel: false };
  ks.docs.forEach((s) => {
    if (!s.exists) return;
    const d = s.data();
    if (!antw[d.wie]) return;
    if (d.kind === "oefstop") gestopt[d.wie] = true;
    else if (d.kind === "oef") antw[d.wie][d.vraag_id] = { gekozen: d.gekozen, goed: d.goed === true };
  });
}

const deelnemers = () => (meta.modus === "samen" ? ["Ritchie", "Rachel"] : [meta.door]);
const aantalAntw = (p) => Object.keys(antw[p]).length;
const klaar = (p) => gestopt[p] || (vragen.length > 0 && aantalAntw(p) >= vragen.length);
const goedAantal = (p) => Object.keys(antw[p]).filter((k) => antw[p][k].goed).length;

function feedback(v, s) {
  return (s.goed ? "Goed. " : "Fout. ") + "Het juiste antwoord is " + LETTERS[v.juist] + ": " + v.opties[v.juist] + ". " + (v.toelichting || "");
}

function kaart(v) {
  const art = maak("article", "kaart");
  art.id = "k-" + v.id;
  const onderwerp = maak("p", "chip", v.onderwerp);
  onderwerp.dataset.thema = v.onderwerp;
  art.appendChild(onderwerp);
  art.appendChild(maak("h3", "", v.vraag));
  const s = antw[wie][v.id];
  const opties = maak("div", "opties");
  v.opties.forEach((o, i) => {
    const b = maak("button", "opt " + LETTERS[i]);
    b.type = "button";
    b.dataset.id = v.id;
    b.dataset.idx = String(i);
    b.appendChild(maak("b", "", LETTERS[i] + "."));
    b.appendChild(document.createTextNode(" " + o));
    if (s || klaar(wie)) {
      b.disabled = true;
      if (s && s.gekozen === i) b.classList.add("gekozen");
    }
    opties.appendChild(b);
  });
  art.appendChild(opties);
  if (s) uitslagBlok(art, v.id, s.goed, feedback(v, s), v.bronnen);
  return art;
}

function voortgangBalk(naam, n, totaal) {
  const w = maak("div", "voortgang");
  const p = maak("p");
  p.append(maak("span", "", naam), maak("span", "", n + " van " + totaal));
  const b = maak("div", "balkje");
  const i = document.createElement("i");
  i.style.width = (totaal ? Math.round(100 * n / totaal) : 0) + "%";
  b.appendChild(i);
  w.append(p, b);
  return w;
}

async function nieuweQuiz(modus, knop) {
  knop.disabled = true;
  try {
    const id = await window.dbRpc("maak_oefquiz", { p_wie: wie, p_modus: modus });
    location.href = "oefenquiz.html?id=" + encodeURIComponent(id);
  } catch (e) {
    toonFout("Een nieuwe quiz maken lukte niet. Probeer het zo nog eens.");
    knop.disabled = false;
  }
}

function render() {
  if (!document.documentElement.hasAttribute("data-geladen")) setTimeout(function () { document.documentElement.setAttribute("data-geladen", ""); }, 1200);
  if (meta && meta.verwijderd) { el("quiz").textContent = ""; el("acties").textContent = ""; toonFout("Deze quiz is verwijderd."); return; }
  if (!meta) {
    el("wie").textContent = "";
    toonFout("Deze quiz bestaat niet (meer).");
    return;
  }
  const dn = deelnemers();
  if (!dn.includes(wie)) {
    el("wie").textContent = "Deze quiz is van " + meta.door + ".";
    el("quiz").textContent = "";
    return;
  }
  el("modus").textContent = meta.modus === "samen" ? "Samen met " + andere : "Alleen";
  el("wie").textContent = "Telt niet mee voor de punten";

  const totaal = vragen.length;
  const vg = el("voortgang");
  vg.textContent = "";
  vg.hidden = false;
  vg.appendChild(voortgangBalk("Jij", aantalAntw(wie), totaal));
  if (meta.modus === "samen") vg.appendChild(voortgangBalk(andere, aantalAntw(andere), totaal));

  const z = el("quiz");
  z.textContent = "";
  vragen.forEach((v) => z.appendChild(kaart(v)));

  const uit = el("uitslag");
  const acties = el("acties");
  uit.textContent = "";
  acties.textContent = "";
  const iedereenKlaar = dn.every(klaar);
  if (klaar(wie)) {
    uit.hidden = false;
    const box = maak("section", "uitslag");
    box.appendChild(maak("h2", "", iedereenKlaar ? "Klaar" : "Jij bent klaar"));
    box.appendChild(maak("p", "", "Jij: " + goedAantal(wie) + " goed van " + aantalAntw(wie) + (gestopt[wie] && aantalAntw(wie) < totaal ? " (gestopt)" : "") + "."));
    if (meta.modus === "samen") {
      if (iedereenKlaar) {
        box.appendChild(maak("p", "", andere + ": " + goedAantal(andere) + " goed van " + aantalAntw(andere) + "."));
        const a = goedAantal(wie), b = goedAantal(andere);
        box.appendChild(maak("p", "", a === b ? "Gelijkspel." : (a > b ? "Jij wint met " : andere + " wint met ") + (a === b ? "" : Math.abs(a - b) + (Math.abs(a - b) === 1 ? " punt." : " punten."))));
      } else {
        box.appendChild(maak("p", "", "Wachten op " + andere + " (" + aantalAntw(andere) + " van " + totaal + ")."));
      }
    }
    uit.appendChild(box);
  } else {
    uit.hidden = true;
    const stop = maak("button", stopBevestig ? "extra stop ja" : "extra stop", stopBevestig ? "Zeker weten? Tik nogmaals om te stoppen" : "Stoppen met deze quiz");
    stop.type = "button";
    stop.dataset.actie = "stop";
    acties.appendChild(stop);
  }
  if (klaar(wie)) {
    const a1 = maak("button", "paars", "Nieuwe quiz alleen");
    const a2 = maak("button", "paars", "Nieuwe quiz samen met " + andere);
    a1.type = a2.type = "button";
    a1.addEventListener("click", () => nieuweQuiz("alleen", a1));
    a2.addEventListener("click", () => nieuweQuiz("samen", a2));
    acties.append(a1, a2);
  }
  acties.hidden = !acties.childNodes.length;

  // Bronnen: per vraag pas nadat jij die vraag hebt beantwoord.
  const bl = el("bronnen");
  bl.textContent = "";
  const beantwoord = vragen.filter((v) => antw[wie][v.id]);
  if (!beantwoord.length) bl.appendChild(maak("li", "bronwacht", ""));
  beantwoord.forEach((v) => {
    (v.bronnen || []).forEach((br) => {
      if (!br.url) return;
      const li = maak("li");
      li.appendChild(document.createTextNode("Vraag " + v.i + ": "));
      const a = maak("a", "", br.titel);
      a.href = br.url;
      a.target = "_blank";
      a.rel = "noopener";
      li.appendChild(a);
      bl.appendChild(li);
    });
  });

  // Bij een quiz met twee spelers: zolang de ander nog bezig is, de stand af en toe verversen.
  const moetPollen = meta.modus === "samen" && !iedereenKlaar;
  if (moetPollen && !poll) poll = setInterval(ververs, 5000);
  if (!moetPollen && poll) { clearInterval(poll); poll = null; }
}

async function ververs() {
  if (!db || document.hidden) return;
  try {
    // Alleen opnieuw tekenen als er echt iets veranderd is (een antwoord, een stop, nieuwe vragen); anders knippert de pagina bij elke controle.
    const stand = function () { return JSON.stringify([antw, gestopt, vragen.map(function (v) { return v.id; }), meta && meta.naam]); };
    const voor = stand();
    await laad();
    if (stand() !== voor) render();
  } catch (e) { /* volgende ronde opnieuw */ }
}

async function kies(vraagId, idx) {
  if (antw[wie][vraagId] || klaar(wie)) return;
  const v = vragen.find((x) => x.id === vraagId);
  if (!v) return;
  const goed = idx === v.juist;
  antw[wie][vraagId] = { gekozen: idx, goed: goed };
  uitgeklapt.add(String(vraagId));
  render();
  try {
    await db.doc("keuzes/oef-" + ID + "-" + wie + "-" + v.i).set({
      kind: "oef", oefquiz: ID, wie: wie, i: v.i, vraag_id: vraagId, gekozen: idx, goed: goed, gezet_op: new Date().toISOString(),
    });
    wisFout();
  } catch (e) {
    delete antw[wie][vraagId];
    render();
    toonFout("Opslaan lukte niet. Probeer je antwoord nog een keer.");
  }
}

async function stoppen() {
  try {
    await db.doc("keuzes/oefstop-" + ID + "-" + wie).set({ kind: "oefstop", oefquiz: ID, wie: wie, gezet_op: new Date().toISOString() });
    gestopt[wie] = true;
    render();
  } catch (e) {
    toonFout("Stoppen lukte niet. Probeer het zo nog eens.");
  }
}

el("quiz").addEventListener("click", (e) => {
  const toon = e.target.closest("button.toon");
  if (toon) { wisselUitslag(toon.dataset.toon); render(); return; }
  const knop = e.target.closest("button.opt");
  if (!knop || knop.disabled) return;
  kies(knop.dataset.id, Number(knop.dataset.idx));
});
el("acties").addEventListener("click", (e) => {
  const knop = e.target.closest("button[data-actie=stop]");
  if (!knop) return;
  if (!stopBevestig) {
    stopBevestig = true;
    render();
    setTimeout(() => { stopBevestig = false; render(); }, 6000);
    return;
  }
  stopBevestig = false;
  stoppen();
});
document.addEventListener("visibilitychange", () => { if (!document.hidden) ververs(); });

(async function start() {
  if (!wie || !ID) return;
  db = await window.claude.use("db");
  if (!db) { toonFout("Opslag is nu niet beschikbaar."); return; }
  try { await laad(); render(); } catch (e) { toonFout("Laden lukte niet. Ververs de pagina."); }
})();
document.getElementById("naam-knop").addEventListener("click", function () {
  const rij = document.getElementById("naam-bewerk");
  rij.hidden = !rij.hidden;
  document.getElementById("naam-veld").value = (meta && meta.naam) || "";
  if (!rij.hidden) document.getElementById("naam-veld").focus();
});
document.getElementById("naam-opslaan").addEventListener("click", async function () {
  const n = document.getElementById("naam-veld").value.trim().slice(0, 40);
  if (!n || !meta) return;
  try {
    await db.doc("oefquizzen/" + ID).set(Object.assign({}, meta, { naam: n }));
    meta.naam = n;
    document.getElementById("quiznaam").textContent = n;
    document.getElementById("naam-bewerk").hidden = true;
  } catch (e) {
    toonFout("Naam opslaan lukte niet. Probeer het nog eens.");
  }
});
let verwijderBevestig = false;
document.getElementById("verwijder-knop").addEventListener("click", async function () {
  const knop = this;
  if (!meta || meta.door !== wie) return;
  if (!verwijderBevestig) {
    verwijderBevestig = true;
    knop.textContent = "Zeker weten?";
    knop.classList.add("ja");
    setTimeout(function () { verwijderBevestig = false; knop.textContent = "Verwijderen"; knop.classList.remove("ja"); }, 4000);
    return;
  }
  try {
    // Niet echt wissen: de quiz wordt als verwijderd gemarkeerd en verdwijnt uit de lijsten.
    await db.doc("oefquizzen/" + ID).set(Object.assign({}, meta, { verwijderd: true }));
    location.href = "index.html";
  } catch (e) {
    toonFout("Verwijderen lukte niet. Probeer het nog eens.");
  }
});
</script>
</body>
</html>
