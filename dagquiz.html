<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<title>Feitje van de dag</title>
<style>
.kaart + .kaart { margin-top: 14px; }

:root {
  color-scheme: light;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  --card: var(--vlak);
  --ink: var(--inkt);
  --muted: var(--zacht);
  --line: var(--beige-lijn);
  --a: var(--geel);
  --b: var(--roze-licht);
  --c: var(--goed-licht);
  --d: var(--paars);
  --ok: var(--goed);
  --bad: var(--fout);
  --display: var(--body);
  --body: "Instrument Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--body);
  font-size: 16px;
  line-height: 1.5;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 24px 40px;
}
main { max-width: 560px; margin: 0 auto; display: flex; flex-direction: column; gap: 24px; min-width: 0; }
.top { display: flex; flex-direction: column; gap: 8px; }
.terug { color: var(--ink); font-weight: 600; text-decoration: none; justify-self: start; }
.terug:hover { text-decoration: underline; }
.datum { margin: 0; color: var(--muted); }
.wie { margin: 0; font-weight: 700; }
.melding { margin: 0; padding: 12px 14px; border-radius: 12px; background: var(--vlak); border: 2px solid var(--bad); color: var(--bad); font-weight: 600; }
.quiz { display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.quizkop { display: flex; flex-direction: column; gap: 4px; }
.quizkop h2 { margin: 0; font-family: var(--display); font-size: 26px; font-weight: 600; }
.score { margin: 0; color: var(--muted); font-weight: 600; }
.kaart { background: var(--card); border-radius: 18px; padding: 18px; display: flex; flex-direction: column; gap: 12px; min-width: 0; box-shadow: 0 2px 0 var(--line); }
.chip { margin: 0; justify-self: start; font-size: 13px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; color: var(--muted); }
.quiz > .kaart { margin-bottom: 14px; }
.quiz > .kaart:last-child { margin-bottom: 0; }
.kaart h3 { margin: 0; font-size: 19px; font-weight: 700; line-height: 1.3; text-wrap: balance; }
.opties { display: grid; grid-template-columns: 1fr; gap: 10px; }
@media (min-width: 420px) { .opties { grid-template-columns: 1fr 1fr; } }
.opt {
  min-height: 56px;
  border: 0;
  border-radius: 16px;
  padding: 10px 14px;
  font: inherit;
  font-size: 16px;
  font-weight: 600;
  text-align: left;
  color: var(--ink);
  cursor: pointer;
  min-width: 0;
  overflow-wrap: anywhere;
}
.opt b { margin-right: 4px; }
.opt.a { background: var(--a); }
.opt.b { background: var(--b); }
.opt.c { background: var(--c); }
.opt.d { background: var(--d); }
.opt:disabled { cursor: default; opacity: 0.55; }
.opt.gekozen { opacity: 1; outline: 3px solid var(--ink); outline-offset: 2px; }
.opt:focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; }
.feedback { margin: 0; padding: 12px 14px; border-radius: 12px; background: var(--paars-zacht); font-size: 15px; }
.feedback.ok { border-left: 6px solid var(--ok); }
.feedback.nee { border-left: 6px solid var(--bad); }
.extra, .opnieuw, .plusknop, .verwijder {
  min-height: 52px;
  border-radius: 16px;
  border: 2px solid var(--ink);
  background: transparent;
  color: var(--ink);
  font: inherit;
  font-weight: 700;
  padding: 10px 16px;
  cursor: pointer;
}
.plusknop { background: var(--ink); color: var(--vlak); font-size: 18px; }
.plusknop:disabled { opacity: 0.5; cursor: default; }
.verwijder { border-color: var(--bad); color: var(--bad); }
.verwijder.ja { background: var(--bad); color: var(--vlak); }
.extra:focus-visible, .opnieuw:focus-visible, .plusknop:focus-visible, .verwijder:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }
.plus, .bronnen { display: flex; flex-direction: column; gap: 12px; min-width: 0; background: var(--card); border-radius: 18px; box-shadow: 0 6px 0 var(--lijn); padding: 18px; }
.plus h2, .bronnen h2 { margin: 0; font-size: 13px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--roze-diep); }
.uitleg { margin: 0; color: var(--muted); font-size: 15px; }
.wachtrij { margin: 0; padding-left: 0; list-style: none; color: var(--ink); display: flex; flex-direction: column; gap: 10px; }
.laad { display: flex; flex-direction: column; gap: 6px; margin: 0; }
.laad-kop { display: flex; justify-content: space-between; gap: 12px; font-weight: 700; }
.laad-pct { font-variant-numeric: tabular-nums; }
.laad-balk { height: 14px; border-radius: 999px; background: var(--roze-zacht); overflow: hidden; }
.laad-balk > i { display: block; height: 100%; width: 0%; border-radius: 999px; background: var(--roze); transition: width 0.4s ease; }
.laad.klaar .laad-balk > i { background: var(--mint); }

.bronnen ul { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 8px; overflow-wrap: anywhere; }
.bronnen li { background: var(--bg); border-radius: 12px; padding: 8px 12px; font-size: 15px; }
.bronnen a { color: var(--ink); font-weight: 700; }
.bronnen .bronwacht { background: none; padding: 0; color: var(--muted); font-size: 14px; }
.bronnen .bronkop { background: none; padding: 8px 0 0; font-weight: 800; font-size: 15px; }
.leeg { margin: 0; color: var(--muted); }
.voet { margin: 20px 0 0; text-align: center; }
.voet a { color: var(--ink); font-weight: 700; }
/* Beweging: kort en zacht. Wie verminderde beweging aanzet, ziet niets bewegen (zie onderaan). */
button, a { transition: transform 0.15s ease, box-shadow 0.2s ease, background-color 0.2s ease, opacity 0.2s ease; }
button:active:not(:disabled) { transform: scale(0.97); }
.kaart { animation: omhoog 0.35s ease both; }
/* Na het eerste laden geen instapanimatie meer: anders springen de kaarten elke keer dat de quiz opnieuw wordt getekend. */
html[data-geladen] .kaart { animation: none; }
.opt:not(:disabled):hover { transform: translateY(-2px); box-shadow: 0 4px 0 rgba(42, 31, 74, 0.12); }
.opt.gekozen { animation: puls 0.4s ease; }
.feedback { animation: vervaag 0.4s ease both; }
.laad-balk > i { transition: width 0.6s ease; }
@keyframes omhoog { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
@keyframes vervaag { from { opacity: 0; } to { opacity: 1; } }
@keyframes puls { 0% { transform: scale(1); } 50% { transform: scale(1.03); } 100% { transform: scale(1); } }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
/* Koppen: terugknop, datum en naam als nette chips, score als twee kleurchips */
.top { gap: 12px; }
.terug { align-self: flex-start; display: inline-flex; align-items: center; min-height: 36px; padding: 6px 14px; border-radius: 999px; background: var(--card); box-shadow: 0 2px 0 var(--line); font-size: 14px; }
.datum { font-size: 15px; color: var(--muted); }
.wie { align-self: flex-start; display: inline-flex; align-items: center; min-height: 36px; padding: 6px 14px; border-radius: 999px; background: var(--card); box-shadow: 0 2px 0 var(--line); font-size: 15px; }
.quizkop { gap: 8px; }
.score { display: flex; flex-wrap: wrap; gap: 8px; }
.score span { display: inline-flex; align-items: center; min-height: 28px; padding: 4px 12px; border-radius: 999px; font-size: 14px; font-weight: 800; }
.score .goed { background: var(--mint-zacht); color: var(--ok); }
.score .fout { background: var(--roze-zacht); color: var(--bad); }
</style>

<body>
<main>
  <header class="top">
    <a class="terug" href="index.html">&larr; Overzicht</a>
    <h1>Feitje van de dag</h1>
    <p class="datum" id="datum"></p>
    <p class="wie" id="wie">Laden</p>
  </header>

  <p id="melding" class="melding" hidden></p>

  <div id="quizzen"></div>

  <section class="plus" aria-labelledby="plus-kop">
    <h2 id="plus-kop">Meer quizzen</h2>
    <button id="plusKnop" class="plusknop" type="button">+ Nieuwe quiz maken</button>
    <p class="uitleg" id="nieuwsUitleg" hidden>Of maak een quiz van het nieuws van vandaag, met koppen van NOS.</p>
    <button id="nieuwsKnop" class="plusknop" type="button" hidden>Nieuwsquiz van vandaag</button>
    <ul id="wachtrij" class="wachtrij"></ul>
  </section>

  <details class="bronnen tap">
    <summary><h2 id="bron-kop">Bronnen</h2></summary>
    <ul id="bronnen"></ul>
  </details>

  <p class="voet"><a href="punten.html">Punten bekijken</a></p>
</main>

<script src="supabase-shim.js"></script>
<script src="gezien.js?v=1"></script>
<script src="kleuren.js"></script>
<script src="uitslag.js"></script>
<script>
const DAG = (function () {
  const d = new URLSearchParams(location.search).get("d") || "";
  if (!/^\d{4}-\d{2}-\d{2}$/.test(d)) { location.replace("index.html"); return "0000-00-00"; }
  // Een nieuwe dag staat om QUIZ_UUR Nederlandse tijd online (tijd van de server; nu 00:00).
  if (window.dagIsOpen && !window.dagIsOpen(d)) { location.replace("index.html"); return "0000-00-00"; }
  return d;
})();
const LETTERS = ["a", "b", "c", "d"];
(function () {
  const dt = new Date(DAG + "T12:00:00");
  const tekst = isNaN(dt) ? DAG : dt.toLocaleDateString("nl-NL", { weekday: "long", day: "numeric", month: "long", year: "numeric" });
  document.getElementById("datum").textContent = tekst.charAt(0).toUpperCase() + tekst.slice(1);
})();
const DAILY_IDS = [1, 2, 3, 4, 5, 6, 7, 8].map((n) => DAG + "-" + n);
const EXTRA_FROM = 6;

let db = null;
let wie = null;
let quizzen = [];
let aanvragen = [];
let attempts = {};
let punten = { goed: 0, totaal: 0 };
let rondes = {};
let keuzes = {};
let extraOpen = true;
const bezig = new Set();

const el = (id) => document.getElementById(id);

function maak(tag, cls, tekst) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (tekst !== undefined) e.textContent = tekst;
  return e;
}


// Uitslag per vraag: een badge (Goed/Fout) en een knop. Het antwoord staat verborgen tot je op de knop tikt.
const uitgeklapt = new Set();
function uitslagBlok(kaart, id, goed, tekst, bronnen) {
  const rij = maak("div", "uitslag-rij");
  rij.appendChild(maak("span", "badge " + (goed ? "goed" : "fout"), goed ? "Goed" : "Fout"));
  const open = uitgeklapt.has(String(id));
  const knop = maak("button", "toon", open ? "Verberg" : "Bekijk antwoord");
  knop.type = "button";
  knop.dataset.toon = id;
  knop.setAttribute("aria-expanded", String(open));
  rij.appendChild(knop);
  kaart.appendChild(rij);
  if (open) {
    kaart.appendChild(maak("p", "antwoord-tekst", tekst));
    const links = (bronnen || []).filter(function (b) { return b.url; });
    if (links.length) {
      const regel = maak("p", "bron-regel");
      links.forEach(function (br, k) {
        if (k) regel.appendChild(document.createTextNode(" · "));
        const a = maak("a", "", br.titel);
        a.href = br.url; a.target = "_blank"; a.rel = "noopener";
        regel.appendChild(a);
      });
      kaart.appendChild(regel);
    }
  }
}
function wisselUitslag(id) { id = String(id); if (uitgeklapt.has(id)) uitgeklapt.delete(id); else uitgeklapt.add(id); }

// Stuurt een kort bericht naar de chat (ook de koppeling voor nieuwe quizzen). Faalt stil: de quiz zelf gaat altijd door.
async function postBericht(tekst, soort, link) {
  try {
    const db = await window.claude.use("db");
    const id = "b-" + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
    await db.doc("berichten/" + id).set({ van: wie, aan: (wie === "Ritchie" ? "Rachel" : "Ritchie"), tekst: tekst, soort: soort || "tekst", link: link || null, tijd: new Date().toISOString() });
  } catch (e) { /* geen chatbericht, de quiz is er wel */ }
}

function toonFout(tekst) {
  const m = el("melding");
  m.textContent = tekst;
  m.hidden = false;
}

async function diag(e) {
  const code = e && (e.code || e.name) ? String(e.code || e.name) : "onbekend";
  const msg = e && e.message ? String(e.message).slice(0, 100) : "";
  let r = "rechten onbekend";
  try {
    const u = window.claude && window.claude.use ? await window.claude.use("user") : null;
    if (u) {
      const [w, ed] = await Promise.all([u.can("data.write"), u.canEdit()]);
      r = "schrijfrechten " + (w === true ? "ja" : w === false ? "nee" : "onbekend") + ", bewerker " + (ed ? "ja" : "nee");
    }
  } catch (x) { /* rechten onbekend */ }
  return "[" + code + (msg ? ": " + msg : "") + "; " + r + "]";
}

function qLees() {
  try {
    const a = JSON.parse(localStorage.getItem("feitje-wachtrij-" + wie) || "[]");
    return Array.isArray(a) ? a : [];
  } catch (e) { return []; }
}

function qSchrijf(a) {
  try { localStorage.setItem("feitje-wachtrij-" + wie, JSON.stringify(a)); } catch (e) { /* geen opslag */ }
}

// Schrijven mag niet altijd (alleen lezen). Dan bewaren we het antwoord op dit apparaat
// en sturen het door zodra het wel kan. De eerste poging per vraag blijft de eerste.
function wachtZet(path, data) {
  const a = qLees();
  const i = a.findIndex((x) => x.p === path);
  if (i >= 0) {
    if (path.indexOf("attempts/") === 0) return;
    a[i] = { p: path, d: data };
  } else {
    a.push({ p: path, d: data });
  }
  qSchrijf(a);
}

async function wachtLeeg(db) {
  const rest = qLees();
  try {
    while (rest.length) {
      const x = rest[0];
      if (x.p.indexOf("attempts/") === 0) {
        const s = await db.doc(x.p).get();
        if (!s.exists) await db.doc(x.p).set(x.d);
      } else {
        await db.doc(x.p).set(x.d);
      }
      rest.shift();
      qSchrijf(rest);
    }
  } catch (e) { /* nog geen schrijfrechten: blijft in de wachtrij */ }
}

async function schrijf(db, path, data) {
  try {
    await db.doc(path).set(data);
  } catch (e) {
    if (e && e.code === "invalid_argument") { wachtZet(path, data); toonFout("Let op: dit antwoord is nog niet op de server opgeslagen. Het staat alleen op dit apparaat en wordt doorgestuurd zodra het lukt. Open de pagina straks opnieuw."); return; }
    throw e;
  }
}

function wisFout() {
  el("melding").hidden = true;
}

async function haalDb() {
  try {
    if (!window.claude || !window.claude.use) return null;
    return await window.claude.use("db");
  } catch (e) {
    return null;
  }
}


// Vanaf het overzicht van punten naar de vraag springen (#...): scrollen en even markeren.
function naarVraag() {
  const h = decodeURIComponent(location.hash.slice(1));
  if (!h) return;
  const e = document.getElementById(h);
  if (!e) return;
  e.scrollIntoView({ block: "center" });
  e.style.outline = "3px solid #ff4f9a";
  e.style.outlineOffset = "3px";
  setTimeout(() => { e.style.outline = ""; }, 3000);
}

function quizKlaar(q) {
  const ronde = rondes[q.key] || 1;
  return q.vragen.length > 0 && q.vragen.every((v) => keuzes[q.key + "|" + ronde + "|" + v.id]);
}

let laatsteSig = "";

function handtekening(vragen, verzoeken) {
  return vragen.map((d) => d.id).sort().join("|") + "#" + verzoeken.map((d) => d.id + ":" + (d.data() || {}).status).sort().join("|");
}

// Quizzen die zijn aangevraagd maar nog geen vragen hebben.
function wachtend() {
  return aanvragen.filter((a) => a.status !== "verwijderd" && !quizzen.some((q) => q.nummer === Number(a.quiz)));
}

// Elke paar seconden kijken of er een quiz klaar is (ook als iemand anders hem heeft aangevraagd).
async function ververs() {
  if (!db || document.hidden) return;
  try {
    const [qs, ax] = await Promise.all([
      db.collection("questions").where("day", "==", DAG).get(),
      db.collection("aanvragen").where("day", "==", DAG).get(),
    ]);
    const sig = handtekening(qs.docs, ax.docs);
    if (sig === laatsteSig) return;
    await laadAlles();
    render();
  } catch (e) { /* volgende ronde opnieuw */ }
}
// Laadbalk met percentage. De database meldt geen echte voortgang (de quiz wordt elke minuut gemaakt), dus het percentage is een schatting
// die rustig naar ongeveer 90% loopt. Zodra de quiz er is, springt hij naar 100% en wordt hij groen.
function laadBalk(tekst, startMs) {
  const w = document.createElement("div");
  w.className = "laad";
  w.dataset.start = String(startMs || Date.now());
  const kop = document.createElement("div");
  kop.className = "laad-kop";
  const t = document.createElement("span");
  t.className = "laad-tekst";
  t.textContent = tekst;
  const pc = document.createElement("span");
  pc.className = "laad-pct";
  pc.textContent = "0%";
  kop.append(t, pc);
  const balk = document.createElement("div");
  balk.className = "laad-balk";
  balk.setAttribute("role", "progressbar");
  balk.setAttribute("aria-valuemin", "0");
  balk.setAttribute("aria-valuemax", "100");
  balk.appendChild(document.createElement("i"));
  w.append(kop, balk);
  laadBalkZet(w, schatting(w));
  return w;
}
function schatting(w) { return Math.round(90 * (1 - Math.exp(-(Date.now() - Number(w.dataset.start)) / 22000))); }
function laadBalkZet(w, p) {
  w.querySelector(".laad-pct").textContent = p + "%";
  w.querySelector(".laad-balk > i").style.width = p + "%";
  w.querySelector(".laad-balk").setAttribute("aria-valuenow", String(p));
}
setInterval(function () {
  document.querySelectorAll(".laad:not(.klaar)").forEach(function (w) { laadBalkZet(w, schatting(w)); });
}, 400);
setInterval(ververs, 3000);
document.addEventListener("visibilitychange", () => { if (!document.hidden) ververs(); });

async function laadAlles() {
  const hoofd = await Promise.all(DAILY_IDS.map((id) => db.doc("questions/" + id).get()));
  const basis = [];
  hoofd.forEach((s, i) => {
    if (!s.exists) return;
    const d = s.data();
    basis.push({
      id: DAILY_IDS[i],
      vraag: d.vraag,
      onderwerp: d.onderwerp,
      opties: d.opties,
      juist: LETTERS.indexOf(d.juist_antwoord),
      toelichting: d.toelichting,
      bronnen: d.bronnen || [],
      extra: i + 1 >= EXTRA_FROM,
    });
  });
  quizzen = [];
  if (basis.length) quizzen.push({ key: "main", nummer: 1, vragen: basis });

  const plus = await db.collection("questions").where("day", "==", DAG).get();
  const groepen = {};
  plus.docs.forEach((s) => {
    if (!s.exists) return;
    const d = s.data();
    (groepen[d.quiz] = groepen[d.quiz] || []).push({
      id: s.id,
      vraag: d.vraag,
      onderwerp: d.onderwerp,
      opties: d.opties,
      juist: d.juist,
      toelichting: d.toelichting,
      bronnen: d.bronnen || [],
      i: d.i,
      titel: d.titel,
      extra: false,
    });
  });
  Object.keys(groepen)
    .map(Number)
    .sort((a, b) => a - b)
    .forEach((n) => {
      groepen[n].sort((a, b) => a.i - b.i);
      quizzen.push({ key: "q" + n, nummer: n, vragen: groepen[n] });
    });

  const ax = await db.collection("aanvragen").where("day", "==", DAG).get();
  // De nieuwsquiz heeft een eigen pagina (nieuwsquiz.html) en hoort niet bij deze dag.
  aanvragen = ax.docs.filter((s) => s.exists).map((s) => Object.assign({ id: s.id }, s.data())).filter((a) => a.soort !== "nieuws");
  laatsteSig = handtekening(plus.docs, ax.docs);

  const at = await db.collection("attempts").where("wie", "==", wie).get();
  attempts = {};
  punten = { goed: 0, totaal: 0 };
  at.docs.forEach((s) => {
    if (!s.exists) return;
    const d = s.data();
    attempts[d.vraag_id] = d.goed === true;
    punten.totaal += 1;
    if (d.goed === true) punten.goed += 1;
  });

  const rs = await db.collection("rondes").where("day", "==", DAG).where("wie", "==", wie).get();
  rondes = {};
  rs.docs.forEach((s) => {
    if (!s.exists) return;
    const d = s.data();
    rondes[d.key] = d.ronde;
  });

  const ks = await db.collection("keuzes").where("day", "==", DAG).where("wie", "==", wie).get();
  keuzes = {};
  ks.docs.forEach((s) => {
    if (!s.exists) return;
    const d = s.data();
    keuzes[d.key + "|" + d.ronde + "|" + d.vraag_id] = { gekozen: d.gekozen, goed: d.goed === true };
  });

  const qa = qLees();
  qa.forEach((x) => {
    if (x.p.indexOf("rondes/") === 0 && x.d.day === DAG) rondes[x.d.key] = x.d.ronde;
  });
  qa.forEach((x) => {
    if (x.p.indexOf("attempts/") === 0 && attempts[x.d.vraag_id] === undefined) {
      attempts[x.d.vraag_id] = x.d.goed === true;
      punten.totaal += 1;
      if (x.d.goed === true) punten.goed += 1;
    }
    if (x.p.indexOf("keuzes/") === 0 && x.d.day === DAG) {
      keuzes[x.d.key + "|" + x.d.ronde + "|" + x.d.vraag_id] = { gekozen: x.d.gekozen, goed: x.d.goed === true };
    }
  });
}

function feedbackTekst(v, s) {
  // De eerste poging blijft in attempts bewaard voor de punten, maar wordt niet getoond.
  return (s.goed ? "Goed. " : "Fout. ") + "Het juiste antwoord is " + LETTERS[v.juist] + ": " + v.opties[v.juist] + ". " + (v.toelichting || "");
}

function kaart(q, v, ronde) {
  const art = maak("article", "kaart");
  art.id = "k-" + v.id;
  const onderwerp = maak("p", "chip", v.onderwerp);
  onderwerp.dataset.thema = v.onderwerp;
  art.appendChild(onderwerp);
  art.appendChild(maak("h3", "", v.vraag));
  const s = keuzes[q.key + "|" + ronde + "|" + v.id];
  const opties = maak("div", "opties");
  v.opties.forEach((o, i) => {
    const b = maak("button", "opt " + LETTERS[i]);
    b.type = "button";
    b.dataset.key = q.key;
    b.dataset.id = v.id;
    b.dataset.idx = String(i);
    b.appendChild(maak("b", "", LETTERS[i] + "."));
    b.appendChild(document.createTextNode(" " + o));
    if (s) {
      b.disabled = true;
      if (s.gekozen === i) b.classList.add("gekozen");
    }
    opties.appendChild(b);
  });
  art.appendChild(opties);
  if (s) uitslagBlok(art, v.id, s.goed, feedbackTekst(v, s), v.bronnen);
  return art;
}

// Namen: de eerste quiz heet "Dagelijkse quiz", de quiz met NOS-koppen "Nieuwsquiz", de rest "Quiz 2", "Quiz 3", enzovoort.
function isNieuws(q) { return q.key !== "main" && !!(q.vragen[0] && /nieuws/i.test(q.vragen[0].titel || "")); }
function quizNaam(q) {
  if (q.key === "main") return "Dagelijkse quiz";
  if (isNieuws(q)) return "Nieuwsquiz";
  return "Quiz " + q.nummer + (q.vragen[0] && q.vragen[0].titel ? ", " + q.vragen[0].titel : "");
}
function quizNaamKort(q) { return q.key === "main" ? "de dagelijkse quiz" : (isNieuws(q) ? "de nieuwsquiz" : "Quiz " + q.nummer); }

function renderQuiz(q) {
  const sec = maak("section", "quiz");
  const ronde = rondes[q.key] || 1;
  let goed = 0;
  let fout = 0;
  q.vragen.forEach((v) => {
    const s = keuzes[q.key + "|" + ronde + "|" + v.id];
    if (s) {
      if (s.goed) goed += 1;
      else fout += 1;
    }
  });
  const kop = maak("div", "quizkop");
  kop.appendChild(maak("h2", "", quizNaam(q)));
  const sc = maak("div", "score");
  sc.append(maak("span", "goed", goed + " goed"), maak("span", "fout", fout + " fout"));
  kop.appendChild(sc);
  if (q.vragen.length && goed + fout === q.vragen.length) kop.appendChild(maak("p", "quiz-klaar", "Klaar · " + goed + " van " + q.vragen.length + " goed"));
  sec.appendChild(kop);

  q.vragen.forEach((v) => {
    if (v.extra && !extraOpen) return;
    sec.appendChild(kaart(q, v, ronde));
  });

  if (q.key === "main" && !extraOpen && q.vragen.some((v) => v.extra)) {
    const ex = maak("button", "extra", "Maak 3 extra vragen");
    ex.type = "button";
    ex.dataset.actie = "extra";
    sec.appendChild(ex);
  }

  const opn = maak("button", "opnieuw", "Speel " + quizNaamKort(q) + " opnieuw");
  opn.type = "button";
  opn.dataset.actie = "opnieuw";
  opn.dataset.key = q.key;
  sec.appendChild(opn);

  // Alleen extra quizzen (2 en hoger) kunnen worden verwijderd, nooit de dagelijkse quiz.
  // Alleen zolang nog niemand een vraag van die quiz heeft beantwoord (de server controleert dit ook voor de ander).
  const beantwoord = Object.keys(keuzes).some((k) => k.indexOf(q.key + "|") === 0) || q.vragen.some((v) => attempts[v.id] !== undefined);
  if (q.key !== "main" && q.nummer >= 2 && !beantwoord) {
    const zeker = verwijderBevestig === q.nummer;
    const del = maak("button", zeker ? "verwijder ja" : "verwijder", zeker ? "Zeker weten? Tik nogmaals om " + quizNaamKort(q) + " te verwijderen" : "Verwijder " + quizNaamKort(q));
    del.type = "button";
    del.dataset.actie = "verwijder";
    del.dataset.nummer = String(q.nummer);
    sec.appendChild(del);
  }
  return sec;
}

// Confetti: korte losse vallende stukjes op een tijdelijk canvas. Geen externe bibliotheek.
function confetti(duur) {
  const c = document.createElement("canvas");
  c.style.cssText = "position:fixed;left:0;top:0;width:100%;height:100%;pointer-events:none;z-index:200";
  document.body.appendChild(c);
  const dpr = window.devicePixelRatio || 1;
  c.width = innerWidth * dpr;
  c.height = innerHeight * dpr;
  const ctx = c.getContext("2d");
  ctx.scale(dpr, dpr);
  const kleuren = ["#ff4f9a", "#1fae8c", "#ffb35c", "#8fb8ff", "#ffe066", "#b5e27a"];
  const stukjes = [];
  for (let i = 0; i < 140; i++) {
    stukjes.push({
      x: innerWidth / 2 + (Math.random() - 0.5) * 120,
      y: innerHeight * 0.4,
      vx: (Math.random() - 0.5) * 11,
      vy: -Math.random() * 12 - 5,
      r: Math.random() * 6 + 5,
      k: kleuren[i % kleuren.length],
      hoek: Math.random() * 6,
      draai: (Math.random() - 0.5) * 0.3
    });
  }
  const start = performance.now();
  function tik(nu) {
    const t = nu - start;
    ctx.clearRect(0, 0, innerWidth, innerHeight);
    stukjes.forEach(function (s) {
      s.vy += 0.3;
      s.vx *= 0.99;
      s.x += s.vx;
      s.y += s.vy;
      s.hoek += s.draai;
      ctx.save();
      ctx.translate(s.x, s.y);
      ctx.rotate(s.hoek);
      ctx.globalAlpha = Math.max(0, 1 - t / duur);
      ctx.fillStyle = s.k;
      ctx.fillRect(-s.r / 2, -s.r / 4, s.r, s.r / 2);
      ctx.restore();
    });
    if (t < duur) requestAnimationFrame(tik);
    else c.remove();
  }
  requestAnimationFrame(tik);
}

// Winnaar van de dagquiz: als jullie allebei alle vragen hebben, krijgt de winnaar confetti (één keer per dag).
async function controleerWinnaar() {
  try {
    const sleutel = "winnaar-" + DAG;
    await Gezien.laad(wie);
    if (Gezien.is(sleutel) || !db) return;
    const mijn = quizzen.find(function (q) { return q.key === "main"; });
    if (!mijn || !mijn.vragen.length) return;
    const ronde = rondes[mijn.key] || 1;
    const alleMijn = mijn.vragen.every(function (v) { return keuzes[mijn.key + "|" + ronde + "|" + v.id]; });
    if (!alleMijn) return;
    const andere = wie === "Ritchie" ? "Rachel" : "Ritchie";
    const at = await db.collection("attempts").where("wie", "==", andere).get();
    const ander = at.docs.filter(function (s) { return s.exists; }).map(function (s) { return s.data(); })
      .filter(function (p) { return p.datum === DAG && /^\d{4}-\d{2}-\d{2}-\d+$/.test(p.vraag_id || ""); });
    if (ander.length < mijn.vragen.length) return;
    const anderGoed = ander.filter(function (p) { return p.goed === true; }).length;
    const mijnGoed = mijn.vragen.filter(function (v) { return keuzes[mijn.key + "|" + ronde + "|" + v.id].goed; }).length;
    Gezien.zet(wie, sleutel);
    const xpWin = mijnGoed > anderGoed ? 150 : mijnGoed === anderGoed ? 75 : 0;
    const titel = mijnGoed > anderGoed ? "Je wint!" : mijnGoed === anderGoed ? "Gelijkspel" : anderGoed > mijnGoed ? andere + " wint" : "Gelijkspel";
    toonUitslagScherm({
      kop: "Dagquiz klaar",
      titel: titel,
      scores: [{ naam: wie, aantal: mijnGoed }, { naam: andere, aantal: anderGoed }],
      xp: mijnGoed * 25 + 50 + xpWin,
      confetti: mijnGoed > anderGoed
    });
  } catch (e) { /* geen confetti als de gegevens niet kloppen */ }
}
function render() {
  if (!document.documentElement.hasAttribute("data-geladen")) setTimeout(function () { document.documentElement.setAttribute("data-geladen", ""); }, 1200);
  controleerWinnaar();
  el("wie").textContent = wie + ", " + punten.goed + " van " + punten.totaal + " punten";

  const z = el("quizzen");
  z.textContent = "";
  if (!quizzen.length) z.appendChild(maak("p", "leeg", "Er zijn nog geen vragen voor vandaag."));
  quizzen.forEach((q) => z.appendChild(renderQuiz(q)));

  const w = el("wachtrij");
  w.textContent = "";
  const open = wachtend();
  open.forEach((a) => {
    const li = maak("li", "", "");
    li.appendChild(laadBalk((a.soort === "nieuws" ? "Nieuwsquiz" : "Quiz " + a.quiz) + " wordt gemaakt", Date.parse(a.aangevraagd) || Date.now()));
    w.appendChild(li);
  });
  el("plusKnop").disabled = !db || open.length > 0;
  el("nieuwsKnop").disabled = !db || open.length > 0;

  // Bronnen per quiz, onder elkaar, met het nummer van de vraag. Ook van quizzen die met + of de nieuwsknop zijn gemaakt.
  const bl = el("bronnen");
  bl.textContent = "";
  quizzen.forEach((q) => {
    const kop = maak("li", "bronkop", quizNaam(q));
    bl.appendChild(kop);
    // Bronnen verraden het antwoord; per vraag verschijnt de bron pas als jij die vraag hebt beantwoord
    // (in deze ronde of eerder: de eerste poging blijft bewaard en alleen die telt voor de punten).
    const ronde = rondes[q.key] || 1;
    const beantwoord = (v) => !!keuzes[q.key + "|" + ronde + "|" + v.id] || attempts[v.id] !== undefined;
    if (!q.vragen.some(beantwoord)) {
      const wacht = maak("li", "bronwacht", "");
      bl.appendChild(wacht);
      return;
    }
    const gezien = {};
    q.vragen.forEach((v, i) => {
      if (!beantwoord(v)) return;
      (v.bronnen || []).forEach((br) => {
        if (!br.url || gezien[br.url]) return;
        gezien[br.url] = true;
        const li = maak("li");
        li.appendChild(document.createTextNode("Vraag " + (i + 1) + ": "));
        const a = maak("a", "", br.titel);
        a.href = br.url;
        a.target = "_blank";
        a.rel = "noopener";
        li.appendChild(a);
        bl.appendChild(li);
      });
    });
  });
}

async function kies(key, vraagId, idx) {
  const sleutel = key + "|" + (rondes[key] || 1) + "|" + vraagId;
  if (keuzes[sleutel] || bezig.has(sleutel)) return;
  const q = quizzen.find((x) => x.key === key);
  const v = q && q.vragen.find((x) => x.id === vraagId);
  if (!v) return;
  bezig.add(sleutel);
  wisFout();
  const goed = idx === v.juist;
  const ronde = rondes[key] || 1;
  const nu = new Date().toISOString();
  try {
    const padPoging = "attempts/" + wie + "-" + vraagId;
    const bestaand = await db.doc(padPoging).get();
    if (bestaand.exists) {
      attempts[vraagId] = bestaand.data().goed === true;
    } else if (attempts[vraagId] === undefined) {
      await schrijf(db, padPoging, { wie: wie, vraag_id: vraagId, datum: DAG, goed: goed, gekozen: LETTERS[idx], gezet_op: nu });
      attempts[vraagId] = goed;
      punten.totaal += 1;
      if (goed) punten.goed += 1;
    }
    await schrijf(db, "keuzes/" + DAG + "-" + wie + "-" + key + "-r" + ronde + "-" + vraagId, {
      day: DAG, wie: wie, key: key, ronde: ronde, vraag_id: vraagId, gekozen: idx, goed: goed, gezet_op: nu,
    });
    keuzes[sleutel] = { gekozen: idx, goed: goed };
    uitgeklapt.add(String(vraagId));
    render();
  } catch (e) {
    toonFout("Opslaan lukte niet. Probeer het opnieuw. " + (await diag(e)));
  } finally {
    bezig.delete(sleutel);
  }
}

async function speelOpnieuw(key) {
  const nieuw = (rondes[key] || 1) + 1;
  try {
    await schrijf(db, "rondes/" + DAG + "-" + key + "-" + wie, { day: DAG, wie: wie, key: key, ronde: nieuw });
    rondes[key] = nieuw;
    wisFout();
    render();
  } catch (e) {
    toonFout("Opnieuw spelen lukte niet. De quiz is niet opnieuw begonnen. " + (await diag(e)));
  }
}

// Een extra quiz verwijderen voor iedereen (ook Ritchie en Rachel zelf): de quiz en de punten ervan verdwijnen.
let verwijderBevestig = null;
let verwijderTimer = null;
async function verwijderQuiz(nr) {
  if (!(nr >= 2)) return;
  // Bevestigen op de pagina zelf (een venster van de browser wordt op sommige apparaten geblokkeerd): tik twee keer.
  if (verwijderBevestig !== nr) {
    verwijderBevestig = nr;
    clearTimeout(verwijderTimer);
    verwijderTimer = setTimeout(() => { verwijderBevestig = null; render(); }, 6000);
    render();
    return;
  }
  clearTimeout(verwijderTimer);
  verwijderBevestig = null;
  try {
    await window.dbRpc("verwijder_quiz", { p_dag: DAG, p_nr: nr });
    wisFout();
    await laadAlles();
    render();
  } catch (e) {
    if (e && String(e.message).indexOf("al beantwoord") !== -1) {
      toonFout("Deze quiz is al (deels) beantwoord en kan daarom niet meer worden verwijderd.");
      await laadAlles();
      render();
      return;
    }
    toonFout("Verwijderen lukte niet. De quiz staat er nog. " + (await diag(e)));
  }
}

async function nieuweQuiz(soort) {
  const wacht = wachtend();
  if (wacht.length) {
    toonFout("Quiz " + wacht.map((a) => a.quiz).join(" en Quiz ") + " wordt nog gemaakt. Vraag pas een nieuwe aan als die klaar is.");
    return;
  }
  const knop = el(soort === "nieuws" ? "nieuwsKnop" : "plusKnop");
  knop.disabled = true;
  try {
    let n = 1;
    quizzen.forEach((q) => { n = Math.max(n, q.nummer); });
    aanvragen.forEach((a) => { n = Math.max(n, Number(a.quiz) || 0); });
    n += 1;
    let id;
    for (;;) {
      id = DAG + "-q" + n;
      const s = await db.doc("aanvragen/" + id).get();
      if (!s.exists) break;
      n += 1;
    }
    const tijd = new Date().toISOString();
    await schrijf(db, "aanvragen/" + id, { day: DAG, quiz: n, status: "open", soort: soort || "gewoon", door: wie, aangevraagd: tijd });
    aanvragen.push({ id: id, day: DAG, quiz: n, status: "open", soort: soort || "gewoon", door: wie, aangevraagd: tijd });
    postBericht(wie + " heeft quiz " + n + " gemaakt.", "quiz", "dagquiz.html?d=" + DAG);
    wisFout();
    render();
  } catch (e) {
    toonFout("Aanvragen lukte niet. Probeer het later opnieuw. " + (await diag(e)));
  } finally {
    render();
  }
}

el("quizzen").addEventListener("click", (e) => {
  const knop = e.target.closest("button");
  if (!knop) return;
  if (knop.dataset.toon) { wisselUitslag(knop.dataset.toon); render(); return; }
  if (knop.dataset.actie === "extra") {
    extraOpen = true;
    render();
    return;
  }
  if (knop.dataset.actie === "opnieuw") {
    speelOpnieuw(knop.dataset.key);
    return;
  }
  if (knop.dataset.actie === "verwijder") {
    verwijderQuiz(Number(knop.dataset.nummer));
    return;
  }
  if (knop.classList.contains("opt") && !knop.disabled) {
    kies(knop.dataset.key, knop.dataset.id, Number(knop.dataset.idx));
  }
});

el("plusKnop").addEventListener("click", () => nieuweQuiz("gewoon"));
el("nieuwsKnop").addEventListener("click", () => nieuweQuiz("nieuws"));
(function () {
  // De nieuwsquiz hoort bij vandaag; op een andere dag blijft de knop weg.
  const vandaag = window.amsterdamNu ? window.amsterdamNu().datum : "";
  // De nieuwsquiz zit sinds 2026-10-22 in het menu "Quiz maken" op de beginpagina; de knop blijft hier verborgen.
})();

async function start() {
  try {
    const w = localStorage.getItem("wie");
    if (w === "Ritchie" || w === "Rachel") wie = w;
  } catch (e) { /* geen opslag */ }
  if (!wie) {
    location.replace("index.html");
    return;
  }
  el("wie").textContent = wie;
  db = await haalDb();
  if (!db) {
    toonFout("Opslag is nu niet beschikbaar. De quiz kan daarom niet worden bewaard.");
    el("plusKnop").disabled = true;
    el("nieuwsKnop").disabled = true;
    return;
  }
  await wachtLeeg(db);
  await laadAlles();
  el("plusKnop").disabled = false;
  el("nieuwsKnop").disabled = false;
  render();
  naarVraag();
}

start().catch(() => toonFout("Laden lukte niet. Ververs de pagina."));
</script>
